<!-- templates/errors/404.html -->
{% extends "base.html" %}

{% block title %}Page Not Found - VelvetSignals{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="{{ url_for('creators') }}" class="btn btn-secondary">
                    <i class="fas fa-users"></i> Browse Creators
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
    }

    .error-content {
        max-width: 600px;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
        margin-bottom: 1rem;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .error-content h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: var(--light);
    }

    .error-content p {
        color: var(--gray);
        font-size: 1.125rem;
        margin-bottom: 2rem;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }

    @media (max-width: 768px) {
        .error-code {
            font-size: 6rem;
        }

        .error-content h1 {
            font-size: 2rem;
        }

        .error-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}
